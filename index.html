<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>아이들 스쿨 · 방치형 학교 키우기</title>
  <meta name="description" content="교과서를 눌러 지식을 모으고, 연필·학생·선생님·도서관을 들여 학교를 키우는 방치형 클리커 게임.">
  <meta name="theme-color" content="#2b2420">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
  <link rel="stylesheet" href="src/style.css">
  <style>html { touch-action: manipulation; } body { margin: 0; padding: 24px 12px; min-height: 100vh; background: #2b2420 radial-gradient(circle at 50% 0%, #4a3b30, #1f1916 70%); }
    @media (max-width: 760px) { body { padding: 8px 6px; } }</style>
</head>
<body>
  <!-- 웹사이트에 넣을 때는 이 div + 아래 스크립트 4개 + style.css 만 있으면 된다 (폰트 2개는 선택) -->
  <div id="idle-game"></div>

  <script src="src/data.js"></script>
  <script src="src/quiz-data.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/ui.js"></script>
  <script>
    window.game = Idddle.mount(document.getElementById('idle-game'), { saveKey: 'idddle-school-v1' });
    // 더블탭 확대는 CSS touch-action: manipulation 으로 막고,
    // iOS 사파리의 두 손가락 확대 제스처도 게임 페이지에서는 막는다.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>
